<div id=settings class=settings>
  <div class=right>
    <button id=btnToggleSettings class=btn-toggle-settings>
      <span data-trans>Settings</span>
      <i class=toggle-arrow>▲</i>
    </button>
    <div class="collapsed collapsible-rows">
      <div class=row>
        <label for=sltMap>

      <div class="row row-toggles">

            <span data-trans>Recording</span>
          </label>
          <input type=checkbox id=chkAutoRecording>
        </div>
        <div class=toggle-item>
          <label for=chkSkill>
            <i class="bomb icon"></i>
            <span data-trans>Using skills</span>
          </label>
          <input type=checkbox id=chkSkill checked>
        </div>
      </div>
      <div class=row>
        <label>
          <i class="icon trophy"></i>

        </label>
        <div class=btn-group>

          <button class="btn-last-winner btn-winner" data-trans>Last</button>

        </div>
      </div>

  </div>
  <div class=left>

    <div class=chzzk-panel>

        <span class=chzzk-arrow>▼</span>
      </button>
      <div class=chzzk-body id=chzzkBody>

        
        <div class="chzzk-row chzzk-search-results">
          <input class=chzzk-input id=chzzkChannelInput placeholder="채널명 또는 채널 ID" autocomplete=off>
          <button class="chzzk-btn chzzk-btn-gray" id=btnChzzkSearch>검색</button>
          <div class=chzzk-dropdown id=chzzkDropdown></div>
        </div>

        
        <div class=chzzk-row>
          <span class=chzzk-label id=chzzkSelectedLabel style=color:#03c773;flex:1>채널을 선택하세요</span>
          <button class="chzzk-btn chzzk-btn-green" id=btnChzzkConnect>연결</button>
          <button class="chzzk-btn chzzk-btn-red" id=btnChzzkDisconnect disabled>해제</button>
        </div>

        
        <div class=chzzk-status>
          <span class=chzzk-dot id=chzzkDot></span>
          <span id=chzzkStatusText>연결 안 됨</span>
        </div>

        
        <div class=chzzk-row>
          <span class=chzzk-label>참여 명령어</span>
          <input class=chzzk-input id=chzzkCommand value=!참여 style=max-width:90px>
